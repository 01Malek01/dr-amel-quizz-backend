# منصة اختبارات د. أمل — الخادم وقاعدة البيانات فقط (الواجهة على Vercel)
#
#   cd backend
#   cp .env.docker.example .env.docker      ثم عدّل القيم
#   docker compose -f docker-compose.backend.yml --env-file .env.docker up -d --build
#
# الإيقاف:   docker compose -f docker-compose.backend.yml --env-file .env.docker down
# السجلّات:  docker compose -f docker-compose.backend.yml logs -f backend
#
# منفذ الخادم مربوط بـ 127.0.0.1 فقط، فلا يصل إليه أحد من الإنترنت مباشرة،
# وnginx على الخادم نفسه (لا داخل حاوية) هو ما يُمرّر إليه.
# قاعدة البيانات لا تُنشر على أي منفذ: لا يصل إليها إلا الخادم عبر شبكة compose.
#
# ملاحظة: متغيرات هذا الملف مسبوقة بـ DQ_ عن قصد. ملف backend/.env الخاص
# بالتطوير يحمل أسماءً مثل JWT_SECRET، ولو استُخدمت الأسماء نفسها هنا لكان
# `docker compose up` بدون --env-file يسحب قيم التطوير بصمت إلى الإنتاج.

name: dr-amel-quizzes

services:
  mongo:
    image: mongo:${DQ_MONGO_IMAGE_TAG:-8}
    container_name: dq-mongo
    restart: unless-stopped
    environment:
      # مونغو 8 يرفض العمل على نواة لينكس 6.19 وما بعدها حتى 7.0.13 بسبب
      # تعارض في مكتبة tcmalloc (SERVER-121912). الحل الرسمي ترقية النواة إلى
      # 7.0.14 أو أحدث. وإن تعذّر ذلك فاضبط في ملف البيئة:
      #   DQ_MONGO_GLIBC_TUNABLES=glibc.pthread.rseq=0
      # تعرف أنك بحاجة إليه إذا ظهر في سجلّ mongo: MongoDB cannot start
      GLIBC_TUNABLES: ${DQ_MONGO_GLIBC_TUNABLES:-}
    # حدّ ذاكرة التخزين المؤقت لمحرك WiredTiger: 0.5 = 512 ميجابايت.
    # بدونه يأخذ مونغو نصف ذاكرة الخادم تقريبًا، وهو كثير على خادم صغير.
    command: ["mongod", "--wiredTigerCacheSizeGB", "${DQ_MONGO_CACHE_GB:-0.5}"]
    # سقف أعلى للحاوية كلها (الذاكرة المؤقتة + بقية احتياج مونغو)
    mem_limit: ${DQ_MONGO_MEM_LIMIT:-1g}
    # أزل التعليق عن السطرين التاليين فقط إن أردت الاتصال بها من الخادم نفسه
    # بأداة مثل mongosh أو Compass عبر نفق SSH.
    # ports:
    #   - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
    image: dq-backend
    container_name: dq-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5007
      # الافتراضي هو حاوية مونغو في هذا الملف. ولقاعدة بيانات مستضافة (مثل
      # Atlas) اضبط DQ_MONGO_URI بسلسلة الاتصال، وعلّق خدمة mongo أدناه.
      MONGO_URI: ${DQ_MONGO_URI:-mongodb://mongo:27017/dr-amel-quizzes}
      # مطلوبان — سيتوقف التشغيل برسالة واضحة إن لم تُضبطا في ملف البيئة
      JWT_SECRET: ${DQ_JWT_SECRET:?اضبط JWT_SECRET في ملف البيئة}
      ADMIN_PASSWORD: ${DQ_ADMIN_PASSWORD:?اضبط ADMIN_PASSWORD في ملف البيئة}
      JWT_EXPIRES_IN: ${DQ_JWT_EXPIRES_IN:-7d}
      # عناوين الواجهة المسموح لها (CORS). عدة عناوين تُفصل بفاصلة، ويمكن
      # استخدام النجمة بدل النطاق الفرعي: https://*.vercel.app
      CLIENT_URL: ${DQ_CLIENT_URL:?اضبط CLIENT_URL بعنوان الواجهة على Vercel}
      ADMIN_NAME: ${DQ_ADMIN_NAME:-Dr. Amel}
      ADMIN_EMAIL: ${DQ_ADMIN_EMAIL:-admin@dramel-quizzes.com}
      ADMIN_USERNAME: ${DQ_ADMIN_USERNAME:-admin}
      UPLOAD_DIR: uploads
    ports:
      - "127.0.0.1:${DQ_BACKEND_PORT:-5007}:5007"
    volumes:
      # صور الأسئلة والإجابات التي يرفعها المسؤول — يجب أن تبقى بعد إعادة البناء
      - uploads_data:/app/uploads

volumes:
  mongo_data:
  mongo_config:
  uploads_data:
